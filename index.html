<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b0a" />
    <meta name="description" content="My Finance — a private, on-device personal finance tracker in Pakistani Rupees." />
    <title>My Finance</title>
    <script>
      (() => {
        let theme = 'dark';
        try {
          const saved = localStorage.getItem('my_finance_theme_v1');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (saved === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch { /* Use the dark default when browser storage is unavailable. */ }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#090b0a' : '#f5f5f2';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
